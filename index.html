<!-- Theme toggle -->
<button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle dark mode">🌙</button>

<script>
// Theme toggle — vanilla JS
(function() {
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  const saved = localStorage.getItem('kc_theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    root.setAttribute('data-theme', 'dark');
    btn.textContent = '☀';
  }
  btn.addEventListener('click', function() {
    const isDark = root.getAttribute('data-theme') === 'dark';
    if (isDark) {
      root.removeAttribute('data-theme');
      btn.textContent = '🌙';
      localStorage.setItem('kc_theme', 'light');
    } else {
      root.setAttribute('data-theme', 'dark');
      btn.textContent = '☀';
      localStorage.setItem('kc_theme', 'dark');
    }
  });
})();
</script>
