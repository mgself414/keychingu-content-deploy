<script>
// Dynamic render from contents.json (ZH mirror of en/regions — title_zh/summary_zh, cn_available)
(function() {
  function render(gridId, countId, tag) {
    var grid = document.getElementById(gridId);
    if (!grid) return;
    fetch('../data/contents.json')
      .then(function(r) { return r.json(); })
      .then(function(items) {
        var picks = items.filter(function(x) {
          return x && x.slug && Array.isArray(x.tags) && x.tags.indexOf(tag) !== -1 &&
                 String(x.cn_available).toLowerCase() === 'true';
        });
        picks.sort(function(a, b) { return String(a.id).localeCompare(String(b.id)); });
        grid.innerHTML = picks.map(function(x) {
          var title = x.title_zh || x.title_en || x.slug;
          var desc = (x.summary_zh || x.summary_en || '');
          return '<a href="../content/' + x.slug + '.zh.html" class="meta-card">' +
                 '<span class="num">#' + (String(x.id).match(/^\d+/) || [''])[0] + '</span>' +
                 '<h3>' + title + '</h3><p>' + desc + '</p></a>';
        }).join('');
        var c = document.getElementById(countId);
        if (c) c.textContent = '(' + picks.length + ' 篇 · 自动列表)';
      })
      .catch(function() {});
  }
  render('regional-grid', 'regional-count', 'regional');
  render('localpicks-grid', 'localpicks-count', 'local-picks');
  render('seoulwide-grid', 'seoulwide-count', 'seoul-wide');
})();
</script>
