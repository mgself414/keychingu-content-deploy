name: Deploy static content to Pages

# 정적 사이트(.nojekyll) — legacy Jekyll 빌드가 사이트 과대로 타임아웃/실패(2026-07-01~)하여
# Actions 기반 업로드-배포로 전환. 빌드 처리 없이 파일 그대로 업로드하므로 legacy 타임아웃 없음.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1건만 (진행 중 배포는 취소하지 않고 큐잉)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
