<button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle dark mode">🌙</button>
<script>
(function() {
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  const saved = localStorage.getItem('kc_theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    root.setAttribute('data-theme', 'dark'); btn.textContent = '☀';
  }
  btn.addEventListener('click', function() {
    const isDark = root.getAttribute('data-theme') === 'dark';
    if (isDark) { root.removeAttribute('data-theme'); btn.textContent = '🌙'; localStorage.setItem('kc_theme', 'light'); }
    else { root.setAttribute('data-theme', 'dark'); btn.textContent = '☀'; localStorage.setItem('kc_theme', 'dark'); }
  });
})();
</script>

<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="assets/vendor/leaflet/markercluster.js"></script>
<script>
(function() {
  var el = document.getElementById('global-map');
  if (!el || typeof L === 'undefined') return;
  var COLORS = {restaurant:'#D94C53',cafe:'#C98A2D',bar:'#7B5CB8',shop:'#2D8A6E',attraction:'#3A7BD5',etc:'#8A8A8A'};
  var map = L.map('global-map').setView([37.5665, 126.9780], 12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  var groups = {};   // cat → markerClusterGroup
  var counts = {};
  Object.keys(COLORS).forEach(function(cat) {
    groups[cat] = L.markerClusterGroup({ maxClusterRadius: 46, disableClusteringAtZoom: 17 });
    counts[cat] = 0;
  });

  fetch('data/places/_all.json').then(function(r){ return r.json(); }).then(function(pts) {
    pts.forEach(function(p) {
      var cat = COLORS[p.t] ? p.t : 'etc';
      var gmap = 'https://www.google.com/maps?q=' + p.c[0] + ',' + p.c[1];
      var html = '<strong>' + p.n + '</strong>'
        + (p.a ? '<br><span style="font-size:11px;color:#777">' + p.a + '</span>' : '')
        + '<br><a href="' + gmap + '" target="_blank" rel="noopener">Google Maps ↗</a>'
        + (p.u ? ' · <a href="' + p.u + '" target="_blank" rel="noopener">Naver ↗</a>' : '');
      var m = L.circleMarker(p.c, {radius: 6, color: COLORS[cat], weight: 1.5, fillOpacity: 0.75});
      m.bindPopup(html);
      groups[cat].addLayer(m);
      counts[cat]++;
    });
    Object.keys(groups).forEach(function(cat) { map.addLayer(groups[cat]); });
    document.getElementById('map-count').textContent = pts.length.toLocaleString() + '곳';

    document.querySelectorAll('.map-cat-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var cat = btn.dataset.cat;
        if (btn.classList.toggle('off')) map.removeLayer(groups[cat]);
        else map.addLayer(groups[cat]);
      });
    });
  }).catch(function() { el.innerHTML = '<p style="padding:24px">지도 데이터를 불러오지 못했습니다.</p>'; });
})();
</script>
