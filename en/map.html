<button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle dark mode">🌙</button>
<script>
(function() {
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  const saved = localStorage.getItem('kc_theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    root.setAttribute('data-theme', 'dark'); btn.textContent = '☀';
  }
  btn.addEventListener('click', function() {
    const isDark = root.getAttribute('data-theme') === 'dark';
    if (isDark) { root.removeAttribute('data-theme'); btn.textContent = '🌙'; localStorage.setItem('kc_theme', 'light'); }
    else { root.setAttribute('data-theme', 'dark'); btn.textContent = '☀'; localStorage.setItem('kc_theme', 'dark'); }
  });
})();
</script>

const PRESETS = [['all', 36.3, 127.8, 7], ['서울', 37.555, 126.99, 12], ['부산', 35.16, 129.07, 12], ['제주', 33.39, 126.55, 10], ['경주', 35.84, 129.22, 13], ['강릉', 37.77, 128.9, 13], ['전주', 35.82, 127.14, 13]];
const LI = { en: 0, zh: 1, ja: 2 }[L_];
const T = k => I[L_][k];
const tc = k => (CAT[k] || [k, k, k])[LI];
const ts = k => (SIDO[k] || [k, k, k])[LI];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n == null ? '' : Number(n).toLocaleString('en-US');
const $ = id => document.getElementById(id);
const root = $('tm');
const tok = n => getComputedStyle(root).getPropertyValue(n).trim();

fetch('../data/tourist_map.json').then(r => r.json()).then(DATA => {
  const D = DATA.rows, LV = DATA.tax.leaves, PN = DATA.tax.parents, CM = DATA.cm, RT = DATA.routes || [];
  const pcol = p => tok('--p' + p), col = i => pcol(LV[i].p);
  const nm = r => (L_ === 'ja' && r[15]) || (L_ === 'zh' && r[16]) || r[3] || r[2];
  const price = s => { const m = /^(\d+)-(\d+)$/.exec(s || ''); if (!m) return ''; const a = +m[1], b = +m[2]; return a === b ? `₩${fmt(a)}` : `₩${fmt(a)}–${fmt(b)}`; };
  const on = new Set(LV.map((_, i) => i));
  const st = { q: '', sido: '', sort: 'rv', fit: false, kc: false };

  const map = L.map('tm-map', { preferCanvas: true, zoomSnap: .5, minZoom: 6, maxBounds: [[32, 123], [39.8, 133]] }).setView([36.3, 127.8], 7);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
  const rend = L.canvas({ padding: .5 });
  const layer = L.layerGroup().addTo(map);
  const routeLayer = L.layerGroup().addTo(map);
  const mk = D.map((r, i) => {
    if (r[0] == null) return null;
    const pop = Math.max(r[9] || 0, r[8] || 0), ref = r[14].length > 0;
    const m = L.circleMarker([r[0], r[1]], { renderer: rend, radius: 3.5 + Math.min(6, Math.log10(1 + pop) * 1.5), weight: ref ? 2.2 : 1, color: ref ? '#1d2321' : '#ffffff', opacity: .95, fillColor: col(r[4]), fillOpacity: .88 });
    m.on('click', () => m.bindPopup(popup(i), { maxWidth: 290 }).openPopup());
    return m;
  });
  const gmap = r => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r[0] != null ? `${r[2]} ${r[6] || ''}` : `${r[2]} ${r[6] || ''}`);
  const glink = id => SITE + CM[id][0] + '.' + L_ + '.html';
  const gtitle = id => CM[id][1 + LI] || CM[id][1];
  const catLabel = i => { const p = PN[LV[i].p], c = LV[i].l; return p !== c ? `${tc(p)} › ${tc(c)}` : tc(c); };
  function popup(i) {
    const r = D[i];
    const stats = [r[7] ? '★ ' + r[7] : '', r[8] ? `${fmt(r[8])} ${T('reviews')}` : '', r[9] ? '♥ ' + fmt(r[9]) : ''].filter(Boolean).join(' · ');
    const pr = price(r[11]);
    return `<div class="tm-pp"><h3>${esc(nm(r))}</h3>${nm(r) !== r[2] ? `<div class="kr" lang="ko" title="${esc(T('showKr'))}">${esc(r[2])}</div>` : ''}
      <span class="tag" style="box-shadow:inset 3px 0 0 ${col(r[4])}">${catLabel(r[4])}</span>
      <div class="ad" lang="ko">${esc(r[6])}</div>${stats ? `<div>${esc(stats)}</div>` : ''}${pr ? `<div>${T('price')} ${pr}</div>` : ''}${r[12] ? `<div>☎ ${esc(r[12])}</div>` : ''}
      <div class="ln"><a href="${gmap(r)}" target="_blank" rel="noopener">${T('gmap')}</a>${r[10] ? `<a href="${esc(r[10])}" target="_blank" rel="noopener">${T('nmap')}</a>` : ''}</div>
      ${r[10] ? `<div class="note">${T('nmapNote')}</div>` : ''}
      ${r[14].length ? `<div class="refs">${T('guides')(r[14].length)}${r[14].slice(0, 3).map(id => CM[id] ? `<a href="${glink(id)}">${esc(gtitle(id))}</a>` : '').join('')}</div>` : ''}</div>`;
  }

  // UI 텍스트
  document.querySelectorAll('#tm [data-t]').forEach(e => { const v = T(e.dataset.t); e.innerHTML = typeof v === 'function' ? v(fmt(D.length)) : v; });
  $('tm-q').placeholder = T('q');
  const sc = {}; D.forEach(r => { if (r[5]) sc[r[5]] = (sc[r[5]] || 0) + 1; });
  $('tm-sido').innerHTML = `<option value="">${T('all_kr')}</option>` + Object.entries(sc).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<option value="${k}">${esc(ts(k))} (${fmt(n)})</option>`).join('');
  $('tm-sort').innerHTML = Object.entries(T('sort')).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  $('tm-presets').innerHTML = PRESETS.map(([k, a, o, z]) => `<button type="button" data-v="${a},${o},${z}">${esc(k === 'all' ? T('all_kr') : ts(k))}</button>`).join('');
  $('tm-route').innerHTML = `<option value="">${T('routeNone')}</option>` + RT.map((r, i) => `<option value="${i}">${esc(r.title[L_] || r.title.en)}</option>`).join('');
  if (!RT.length) $('tm-route').closest('.tm-box').hidden = true;

  // 분류 체크박스 (2단)
  const gc = LV.map((_, i) => D.reduce((a, r) => a + (r[4] === i), 0));
  const kidsOf = p => LV.map((x, i) => x.p === p ? i : -1).filter(i => i >= 0 && gc[i]);
  const chips = $('tm-chips');
  chips.innerHTML = PN.map((name, p) => {
    const ks = kidsOf(p); if (!ks.length) return '';
    const tot = ks.reduce((a, i) => a + gc[i], 0), multi = ks.length > 1 || LV[ks[0]].l !== name;
    return `<div class="tm-par">${multi ? `<button type="button" class="tm-tg" data-p="${p}" aria-expanded="false" aria-label="${esc(T('expand'))}">▾</button>` : '<span class="tm-sp"></span>'}
      <label class="tm-cat"><input type="checkbox" id="tm-p${p}" checked><i style="background:${pcol(p)}"></i><span>${esc(tc(name))}</span><span class="n">${fmt(tot)}</span></label></div>
      ${multi ? `<div class="tm-kids" id="tm-k${p}" hidden>${ks.map(i => `<label class="tm-cat"><input type="checkbox" id="tm-g${i}" checked><span>${esc(tc(LV[i].l))}</span><span class="n">${fmt(gc[i])}</span></label>`).join('')}</div>` : ''}`;
  }).join('');
  const syncParent = p => { const ks = kidsOf(p), n = ks.filter(i => on.has(i)).length, b = $('tm-p' + p); b.checked = n === ks.length; b.indeterminate = n > 0 && n < ks.length; };
  chips.addEventListener('click', e => { const t = e.target.closest('.tm-tg'); if (!t) return; const k = $('tm-k' + t.dataset.p), open = k.hidden; k.hidden = !open; t.setAttribute('aria-expanded', open); });
  chips.addEventListener('change', e => {
    const b = e.target, id = b.id.slice(3);
    if (id[0] === 'p') { const p = +id.slice(1); kidsOf(p).forEach(i => { b.checked ? on.add(i) : on.delete(i); const c = $('tm-g' + i); if (c) c.checked = b.checked; }); b.indeterminate = false; }
    else if (id[0] === 'g') { const i = +id.slice(1); b.checked ? on.add(i) : on.delete(i); syncParent(LV[i].p); }
    apply();
  });
  const setAll = v => { LV.forEach((_, i) => v ? on.add(i) : on.delete(i)); chips.querySelectorAll('input').forEach(b => { b.checked = v; b.indeterminate = false; }); apply(); };
  $('tm-all').addEventListener('click', () => setAll(true));
  $('tm-none').addEventListener('click', () => setAll(false));

  const score = { rv: r => r[8] ?? -1, lk: r => r[9] ?? -1, rt: r => (r[7] ?? -1) * 1000 + Math.min(r[8] ?? 0, 999) };
  let cur = [];
  function apply(fit) {
    const q = st.q.trim().toLowerCase();
    cur = [];
    for (let i = 0; i < D.length; i++) {
      const r = D[i];
      if (!on.has(r[4]) || (st.sido && r[5] !== st.sido) || (st.fit && r[13] < 2) || (st.kc && !r[14].length)) continue;
      if (q && !(r[2] + ' ' + r[3] + ' ' + r[15] + ' ' + r[16] + ' ' + r[6] + ' ' + tc(LV[r[4]].l)).toLowerCase().includes(q)) continue;
      cur.push(i);
    }
    layer.clearLayers();
    const pts = [];
    cur.forEach(i => { if (mk[i]) { layer.addLayer(mk[i]); pts.push(mk[i].getLatLng()); } });
    if (fit && pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 15 });
    const nc = cur.length - pts.length;
    $('tm-cntl').innerHTML = T('shown')(fmt(cur.length));
    $('tm-nc').textContent = nc ? T('nocoord')(fmt(nc)) : '';
    renderList();
  }
  function renderList() {
    const s = st.sort, arr = cur.slice();
    if (s === 'nm') arr.sort((a, b) => nm(D[a]).localeCompare(nm(D[b]), L_)); else arr.sort((a, b) => score[s](D[b]) - score[s](D[a]));
    $('tm-list').innerHTML = arr.slice(0, 200).map(i => { const r = D[i], n = nm(r);
      const sv = s === 'lk' ? (r[9] ? '♥ ' + fmt(r[9]) : '') : s === 'rt' ? (r[7] ? '★ ' + r[7] : '') : (r[8] ? fmt(r[8]) : '');
      return `<li tabindex="0" data-i="${i}"><span class="tm-dot" style="background:${col(r[4])}"></span><span class="tm-nm">${esc(n)}${n !== r[2] ? ` <span class="tm-krs" lang="ko">${esc(r[2])}</span>` : ''}</span><span class="tm-sc">${sv}</span>
        <span class="tm-mt">${esc(r[5] ? ts(r[5]) : '')} · ${esc(tc(LV[r[4]].l))}${r[0] == null ? ' · ' + T('noloc') : ''}</span></li>`; }).join('')
      + (arr.length > 200 ? `<li class="tm-more">${T('more')(fmt(arr.length))}</li>` : '');
  }
  function pick(i) { if (mk[i]) { map.setView(mk[i].getLatLng(), Math.max(map.getZoom(), 16)); mk[i].bindPopup(popup(i), { maxWidth: 290 }).openPopup(); } else L.popup().setLatLng(map.getCenter()).setContent(popup(i)).openOn(map); }
  $('tm-list').addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) pick(+li.dataset.i); });
  $('tm-list').addEventListener('keydown', e => { if (e.key === 'Enter') { const li = e.target.closest('li[data-i]'); if (li) pick(+li.dataset.i); } });

  // 코스 동선
  function showRoute(k) {
    routeLayer.clearLayers();
    const ol = $('tm-stops');
    if (k === '') { ol.hidden = true; ol.innerHTML = ''; return; }
    const r = RT[+k], pts = r.stops.filter(s => s.lat != null);
    const ll = pts.map(s => [s.lat, s.lng]);
    if (ll.length > 1) L.polyline(ll, { color: tok('--route'), weight: 5, opacity: .85, dashArray: r.stops.some(s => s.mode && s.mode !== 'walk') ? null : '1 9', lineCap: 'round' }).addTo(routeLayer);
    pts.forEach((s, j) => L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: `<div class="tm-num">${r.stops.indexOf(s) + 1}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) })
      .bindTooltip(`${esc(s.en || s.ko)} <span lang="ko">${esc(s.ko)}</span>`).addTo(routeLayer));
    if (ll.length) map.fitBounds(L.latLngBounds(ll), { padding: [40, 40], maxZoom: 16 });
    const link = CM[String(r.id)] ? `<li style="list-style:none;margin:4px 0 0 -22px"><a href="${glink(String(r.id))}">${T('routeGuide')} →</a></li>` : '';
    ol.innerHTML = r.stops.map((s, j) => `<li data-j="${j}">${esc(s.en || s.ko)} <span class="tm-krs" lang="ko">${esc(s.ko)}</span>${j && s.min ? ` <span class="tm-krs">· ${T('min')(s.min)}</span>` : ''}</li>`).join('') + link;
    ol.hidden = false;
  }
  $('tm-route').addEventListener('change', e => showRoute(e.target.value));
  $('tm-stops').addEventListener('click', e => { const li = e.target.closest('li[data-j]'); if (!li) return; const s = RT[+$('tm-route').value].stops[+li.dataset.j]; if (s.lat != null) map.setView([s.lat, s.lng], 17); });

  let tm; $('tm-q').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => { st.q = e.target.value; apply(!!st.q); }, 220); });
  $('tm-sido').addEventListener('change', e => { st.sido = e.target.value; apply(true); if (!st.sido) map.setView([36.3, 127.8], 7); });
  $('tm-sort').addEventListener('change', e => { st.sort = e.target.value; renderList(); });
  $('tm-fit').addEventListener('change', e => { st.fit = e.target.checked; apply(); });
  $('tm-kc').addEventListener('change', e => { st.kc = e.target.checked; apply(); });
  $('tm-presets').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const [a, o, z] = b.dataset.v.split(',').map(Number); map.setView([a, o], z); });
  apply();
});
})();
</script>
<!-- tourist-map-script:end -->

</body>
</html>
