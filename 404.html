<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="요청하신 페이지가 없거나 이동되었습니다. 키친구 홈으로 돌아가 100+편 가이드를 둘러보세요.">
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<header class="site-header">
  <a href="index.html"><img src="assets/logo/logo_2-4_color_small.png" alt="KeyChinGu" class="site-logo"></a>
  <nav class="site-nav">
    <a href="index.html">홈</a>
    <a href="about.html">About</a>
    <a href="faq.html">FAQ</a>
  </nav>
  <div class="lang-switch">
    <a href="404.html" class="active">KR</a>
    <a href="en/index.html">EN</a>
  </div>
</header>

<main class="error-page">
  <div class="error-box">
    <div class="error-code">404</div>
    <h1>페이지를 찾을 수 없어요</h1>
    <p>요청하신 페이지가 없거나, 이동·삭제되었을 수 있습니다.</p>
    <p>아래 링크에서 키친구 콘텐츠를 둘러보세요.</p>

    <div class="error-links">
      <a href="index.html" class="error-btn primary">🏠 홈으로 (100+편 가이드)</a>
      <a href="about.html" class="error-btn">ℹ About — 키친구 소개</a>
      <a href="faq.html" class="error-btn">❓ FAQ — 자주 묻는 질문</a>
    </div>

    <p class="error-hint">
      또는 <a href="index.html#search">검색</a>으로 원하는 콘텐츠를 찾아보세요. (예: 홍대, 카페, 강남, 한복)
    </p>
  </div>
</main>

<footer class="site-footer">
  <p><a href="https://instagram.com/keychingu.korea" target="_blank">@keychingu.korea</a> &mdash; Seoul for MZ FIT Travelers</p>
</footer>

<button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle dark mode">🌙</button>

<script>
(function() {
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  const saved = localStorage.getItem('kc_theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    root.setAttribute('data-theme', 'dark');
    btn.textContent = '☀';
  }
  btn.addEventListener('click', function() {
    const isDark = root.getAttribute('data-theme') === 'dark';
    if (isDark) {
      root.removeAttribute('data-theme');
      btn.textContent = '🌙';
      localStorage.setItem('kc_theme', 'light');
    } else {
      root.setAttribute('data-theme', 'dark');
      btn.textContent = '☀';
      localStorage.setItem('kc_theme', 'dark');
    }
  });
})();
</script>

</body>
</html>
